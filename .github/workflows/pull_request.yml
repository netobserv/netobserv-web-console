name: pull request checks

on:
  pull_request:
    branches: ['*']

permissions:
  contents: read

jobs:
  build-test-backend:
    name: Build, lint, test backend
    runs-on: ubuntu-latest

    steps:
    - name: install make
      run: sudo apt-get install make
    - name: set up go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
      with:
        go-version: '1.26'
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      with:
        persist-credentials: false
    - name: build, lint, test
      run: GO_TEST_FLAGS="-race" make backend && git diff --exit-code
    - name: check clean vendors
      run: go mod vendor
    - name: Report coverage
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: ./cover.out
        flags: unittests
        fail_ci_if_error: false
        verbose: true

  build-test-frontend:
    name: Build, lint, test frontend
    runs-on: ubuntu-latest
    steps:
    - name: install make
      run: sudo apt-get install make
    - name: set up node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v6
      with:
        node-version: 22
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      with:
        persist-credentials: false
    - name: build and test
      run: TYPECHECK=true make frontend && git diff --exit-code
    - name: Report coverage
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: ./web/coverage/cobertura-coverage.xml
        flags: uitests
        fail_ci_if_error: false
        verbose: true

  benchmark-server:
    name: Server performance benchmarks
    runs-on: ubuntu-latest
    steps:
    - name: install make
      run: sudo apt-get install make
    - name: set up go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
      with:
        go-version: '1.26'
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      with:
        persist-credentials: false
    - name: run benchmark comparison
      run: make benchmark-server-compare
    - name: upload benchmark results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: benchmark-results
        path: pkg/server/benchmark-current.txt
        retention-days: 30
