apiVersion: v1
kind: Namespace
metadata:
  name: dns-traffic

---
apiVersion: v1
kind: Pod
metadata:
  name: dnsutils
  namespace: dns-traffic
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  dnsConfig:
    options:
      - name: "use-vc"
  containers:
    - name: utils
      image: docker.io/massenz/dnsutils:2.4.0
      # Flood NxDomain queries to push the NxDomain percentage above alert
      # thresholds even in clusters with heavy background DNS traffic.
      command:
        - /bin/sh
        - -ec
        - |
          for i in 1 2 3 4 5; do
            (while :; do dig +short nonexistent-$i.test.svc.cluster.local; done) &
          done
          wait
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
